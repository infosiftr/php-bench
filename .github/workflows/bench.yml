name: Benchmark

on:
  push:
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
      timezone: 'America/Los_Angeles'
  workflow_dispatch:

defaults:
  run:
    shell: 'bash -Eeuo pipefail -x {0}'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  bench:
    name: Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: tianon/actions/checkout/composite@169a61f86f2bdd62a21837ab30aeb1ea4c23bdbe # HEAD

      - name: cpu
        run: ./run.sh bench cpu

      - name: tls
        run: ./run.sh bench tls

      - name: imagick
        run: ./run.sh bench imagick

      - name: throughput
        run: ./run.sh bench throughput

      - name: summary
        run: ./run.sh summarize | tee -a "$GITHUB_STEP_SUMMARY"
        if: always()

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: results-${{ github.sha }}
          path: results/
          overwrite: true
        if: always()
