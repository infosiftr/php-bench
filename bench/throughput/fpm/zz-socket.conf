; Overrides the official image's TCP default (docker.conf sets
; `listen = 9000`) with a Unix socket, since that's how fpm+nginx is
; actually deployed in practice -- see run.sh's bench_throughput_target for
; why. Named to sort after the image's own zz-docker.conf (docker.conf,
; www.conf, www.conf.default, zz-docker.conf, then this), since php-fpm.d/
; is included in filename order and later files win.
[www]
listen = /run/php/php-fpm.sock
listen.mode = 0666
