ServerRoot "/usr/local/apache2"
Listen 80

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule access_compat_module modules/mod_access_compat.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule mime_module modules/mod_mime.so
LoadModule dir_module modules/mod_dir.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_fcgi_module modules/mod_proxy_fcgi.so

<IfModule unixd_module>
User www-data
Group www-data
</IfModule>

ErrorLog /proc/self/fd/2
LogLevel warn

TypesConfig conf/mime.types

DocumentRoot "/var/www/html"
<Directory "/var/www/html">
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
    # DirectoryIndex must be set inside a <Directory> block, not at server
    # scope: it's an APPEND directive, not a REPLACE one -- a bare
    # server-scope DirectoryIndex here would stack behind (not override)
    # whatever a base config already set, and silently make "/" try a
    # chain of nonexistent candidates before ever reaching index.php.
    DirectoryIndex index.php
</Directory>

# The fastcgi_pass equivalent -- talks to php-fpm over the same Unix
# socket nginx uses (see bench/throughput/nginx/nginx.conf and
# bench/throughput/fpm/zz-socket.conf). mod_proxy_fcgi derives
# SCRIPT_FILENAME from DocumentRoot + the request path automatically, no
# manual fastcgi_param-equivalent needed.
<FilesMatch \.php$>
    SetHandler "proxy:unix:/run/php/php-fpm.sock|fcgi://localhost/"
</FilesMatch>
